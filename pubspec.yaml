name: homepage
description: "A new Flutter project."
# Prevents accidental publishing to pub.dev. Remove this line if you wish to publish.
publish_to: 'none'

# Version number is three numbers separated by dots, followed by an optional build number after +.
version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  dotted_border: ^2.0.0
  cupertino_icons: ^1.0.8

  firebase_core: ^3.15.2
  firebase_auth: ^5.3.0
  cloud_firestore: ^5.6.12
  intl: ^0.19.0
  speech_to_text: ^7.3.0
  image_picker: ^1.1.2
  shared_preferences: ^2.2.3
  http: ^1.2.1
  connectivity_plus: ^6.0.0
  google_sign_in: ^6.2.1
  url_launcher: ^6.2.5
  path_provider: ^2.1.5
  record: ^6.0.0
  webview_flutter: ^4.8.0
  webview_windows: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints, activated in analysis_options.yaml
  flutter_lints: ^6.0.0

  # Generates the app launcher icons
  flutter_launcher_icons: ^0.14.4

# App icon settings. Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/appicon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/appicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/cleft.png
    - assets/images/appicon.png
    - assets/images/log.png

  fonts:
    - family: Syne
      fonts:
        - asset: assets/fonts/Syne-Bold.ttf
          weight: 700
        - asset: assets/fonts/Syne-ExtraBold.ttf
          weight: 800
    - family: DMSans
      fonts:
        - asset: assets/fonts/DMSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/DMSans-Medium.ttf
          weight: 500